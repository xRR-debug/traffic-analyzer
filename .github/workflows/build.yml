# Сборка под Windows и macOS, дымовой прогон синтетических дампов
# (tools/gen_test_dumps.py → tools/ci_smoke.py) и релиз.
#
# Каждый push в main (то есть merge PR) после зелёной сборки выпускает релиз
# vГГГГ.ММ.ДД.N с архивами для Windows и macOS и описанием на русском — темами
# коммитов с прошлого релиза (tools/release_notes.py). В PR тот же шаг строит
# только предпросмотр описания (Summary запуска), а архивы лежат в артефактах.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # в PR новая сборка отменяет старую; в main — нет: прерванный релиз хуже очереди
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"   # кириллица в выводе скриптов на Windows

jobs:
  windows:
    name: Windows x64 (Release)
    runs-on: windows-2025          # Visual Studio 2026: toolset v145, как у Release в vcxproj
    timeout-minutes: 40
    env:
      NPCAP_SDK_VERSION: "1.16"
      NPCAP_SDK_SHA256: f0a8be7778ee3ae1b99bbbecb27a3ff0f6c111a4093f1c78c5c5a099607184db
    steps:
      - uses: actions/checkout@v5

      # Файлов Npcap в репозитории нет (лицензия не разрешает распространять).
      # SDK нужен только для сборки — скачиваем с npcap.com и сверяем хеш.
      # Установщик Npcap не вшивается: redist\npcap-installer.exe нет, и
      # vcxproj собирает exe без него (программа отправит на npcap.com).
      - name: Npcap SDK
        shell: pwsh
        run: |
          Invoke-WebRequest "https://npcap.com/dist/npcap-sdk-$env:NPCAP_SDK_VERSION.zip" -OutFile npcap-sdk.zip
          $h = (Get-FileHash npcap-sdk.zip -Algorithm SHA256).Hash
          if ($h -ne $env:NPCAP_SDK_SHA256) { throw "npcap-sdk.zip: SHA256 $h, ожидался $env:NPCAP_SDK_SHA256" }
          Expand-Archive npcap-sdk.zip -DestinationPath npcap-sdk
          if (-not (Test-Path npcap-sdk/Lib/x64/wpcap.lib)) { throw "в архиве нет Lib/x64/wpcap.lib" }

      - uses: microsoft/setup-msbuild@v2

      - name: Сборка
        shell: pwsh
        run: msbuild TrafficAnalyzer.vcxproj /m /nologo /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=$env:GITHUB_WORKSPACE\

      # exe должен запускаться на чистой Windows: без VC++ Redistributable (CRT
      # статический, /MT) и без Npcap (wpcap.dll/Packet.dll — отложенная загрузка)
      - name: Проверка exe
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin.FullName /nologo /dependents x64/Release/TrafficAnalyzer.exe
          $deps
          $bad = $deps | Select-String -Pattern 'VCRUNTIME|MSVCP|CONCRT'
          if ($bad) { throw "exe зависит от VC++ runtime ($($bad -join ', ')) — нужен статический CRT (/MT)" }
          $direct = ($deps -join "`n") -split 'Image has the following delay load dependencies' | Select-Object -First 1
          if ($direct -match 'wpcap|Packet\.dll') { throw "wpcap.dll/Packet.dll в обычных зависимостях — без Npcap exe не запустится" }

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Синтетические дампы
        run: |
          pip install cryptography
          python tools/gen_test_dumps.py testdumps

      - name: Дымовой прогон
        run: python tools/ci_smoke.py testdumps x64/Release/TrafficAnalyzer.exe

      - name: Отчёты прогона
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-windows
          path: testdumps/reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Архив
        shell: pwsh
        run: |
          $d = "dist/TrafficAnalyzer"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item x64/Release/TrafficAnalyzer.exe, analyzer.ini.example -Destination $d
          Copy-Item packaging/README-windows.txt -Destination "$d/README.txt"
          Copy-Item LICENSE -Destination "$d/LICENSE.txt"
          Copy-Item gui/imgui/LICENSE.txt -Destination "$d/LICENSE-imgui.txt"
          Compress-Archive -Path $d -DestinationPath dist/TrafficAnalyzer-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/TrafficAnalyzer-windows-x64.zip
          retention-days: 7
          if-no-files-found: error

  # Релизная сборка macOS: один универсальный бинарник arm64 + x86_64 для
  # macOS 11+, GLFW вшит статически (TA_BUNDLED_GLFW) — Homebrew у
  # пользователя не нужен. Прогон дампов — на arm64.
  macos:
    name: macOS universal
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Сборка
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DTA_BUNDLED_GLFW=ON \
                "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build -j

      - name: Проверка бинарника
        run: |
          b=build/TrafficAnalyzer
          lipo "$b" -verify_arch arm64 x86_64
          otool -L "$b"
          if otool -L "$b" | grep -E '/opt/homebrew|/usr/local'; then
            echo "::error::бинарник зависит от библиотек Homebrew — у пользователя их нет"
            exit 1
          fi
          otool -l "$b" | grep -A4 LC_BUILD_VERSION | grep -E 'minos|platform' || true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Синтетические дампы
        run: |
          pip install cryptography
          python tools/gen_test_dumps.py testdumps

      - name: Дымовой прогон
        run: python tools/ci_smoke.py testdumps build/TrafficAnalyzer

      - name: Отчёты прогона
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-macos
          path: testdumps/reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Архив
        run: |
          d=dist/TrafficAnalyzer
          mkdir -p "$d"
          cp build/TrafficAnalyzer build/anime_bg.jpg build/analyzer.ini.example "$d/"
          cp packaging/README-macos.txt "$d/README.txt"
          cp LICENSE "$d/LICENSE.txt"
          cp gui/imgui/LICENSE.txt "$d/LICENSE-imgui.txt"
          cp build/_deps/glfw-src/LICENSE.md "$d/LICENSE-glfw.txt"
          ditto -c -k --keepParent "$d" dist/TrafficAnalyzer-macos-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/TrafficAnalyzer-macos-universal.zip
          retention-days: 7
          if-no-files-found: error

  # Intel: сборка так, как в README (GLFW из Homebrew), и запуск x86_64-половины
  # релизного бинарника на настоящем Intel.
  macos-intel:
    name: macOS Intel
    needs: macos
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Сборка как в README (GLFW из Homebrew)
        run: |
          brew install glfw        # cmake на раннере уже есть; libcurl и libpcap — из системы
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - uses: actions/download-artifact@v4
        with:
          name: dist-macos
          path: dist

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Релизный бинарник на x86_64
        run: |
          ditto -x -k dist/TrafficAnalyzer-macos-universal.zip dist
          pip install cryptography
          python tools/gen_test_dumps.py testdumps
          python tools/ci_smoke.py --quick testdumps dist/TrafficAnalyzer/TrafficAnalyzer

  release:
    name: Релиз
    needs: [windows, macos, macos-intel]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0           # вся история и теги: описание — коммиты с прошлого релиза
          persist-credentials: false   # токен с правом записи нужен только gh в «Публикации»

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Версия, описание, контрольные суммы
        id: rel
        run: |
          tag=$(python3 tools/release_notes.py version)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # перезапуск старой сборки main: коммит уже вошёл в более новый релиз —
          # выпускать его заново (да ещё как Latest) нельзя
          released=$(python3 tools/release_notes.py released)
          if [ -n "$released" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Коммит уже вошёл в релиз $released — новый релиз не нужен." >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 tools/release_notes.py notes --tag "$tag" --out notes.md
          cd dist
          for f in TrafficAnalyzer-*.zip; do mv "$f" "TrafficAnalyzer-$tag-${f#TrafficAnalyzer-}"; done
          sha256sum TrafficAnalyzer-*.zip > SHA256SUMS.txt
          ls -l
          { echo "## Предпросмотр релиза $tag"; echo; cat ../notes.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Публикация
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          steps.rel.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          # gh сначала создаёт черновик, грузит файлы и только потом публикует.
          # Черновик от прерванного запуска — удалить и выпустить заново
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)" = "true" ]; then
            echo "Остался черновик $TAG от прерванного запуска — удаляю"
            gh release delete "$TAG" --yes
          fi
          # перезапуск сборки того же коммита: тег уже стоит, релиз уже есть
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Релиз $TAG уже есть — пропускаю"
            exit 0
          fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
            --title "TrafficAnalyzer $TAG" --notes-file notes.md
